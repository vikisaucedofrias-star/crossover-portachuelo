<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossover Portachuelo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px}
.app{display:flex;min-height:100vh}.side{width:245px;background:#101827;color:white;padding:20px;position:fixed;height:100vh}.brand{font-size:22px;font-weight:800;margin-bottom:25px}.brand span{font-size:28px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;margin:4px 0}.nav button.active,.nav button:hover{background:#1e293b;color:white}.main{margin-left:245px;width:calc(100% - 245px);padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0}.primary{background:#f97316;color:white}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;padding:18px;border-radius:16px;box-shadow:0 2px 10px #00000008}.card .n{font-size:28px;font-weight:800;margin-top:8px}.muted{color:#64748b}.panel{background:white;border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 2px 10px #00000008}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:9px}.field textarea{min-height:80px}.form-actions{margin-top:16px;display:flex;gap:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{font-size:13px;color:#64748b}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.paid{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.overdue{background:#fee2e2;color:#991b1b}.hidden{display:none}.search{max-width:320px;padding:10px;border:1px solid #dbe2ea;border-radius:10px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:white;border-radius:18px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:12px 16px;border-radius:10px}.empty{text-align:center;padding:35px;color:#64748b}
@media(max-width:800px){.side{width:68px;padding:12px}.brand{font-size:0}.brand span{font-size:25px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:68px;width:calc(100% - 68px);padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{gap:10px;align-items:flex-start}.top h1{font-size:22px}}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#101827"></head>
<body>
<div class="app">
<aside class="side"><div class="brand"><span>🏀</span> Crossover Portachuelo</div><div class="nav">
<button data-page="dashboard">🏠 Dashboard</button><button data-page="players">👥 Deportistas</button><button data-page="categories">🏀 Categorías</button><button data-page="attendance">✅ Asistencia</button><button data-page="fees">💰 Mensualidades</button><button data-page="payments">💵 Pagos</button><button data-page="messages">📲 Mensajes</button><button data-page="reports">📊 Reportes</button><button data-page="settings">⚙️ Configuración</button>
</div></aside>
<main class="main"><div class="top"><h1 id="title">Dashboard</h1><button class="primary" id="quick">＋ Acción rápida</button></div><div id="content"></div></main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="sectionhead"><h2 id="modalTitle">Nuevo</h2><button class="secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='basketadmin_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 academy:{name:'Academia de Básquet Crossover Portachuelo',currency:'Bs'},
 categories:[{id:1,name:'U-10',fee:180},{id:2,name:'U-12',fee:200},{id:3,name:'U-15',fee:250},{id:4,name:'U-18',fee:300}],
 players:[],payments:[],attendance:[],messages:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return `${db.academy.currency} ${Number(n||0).toFixed(2)}`}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2200)}
function cat(id){return db.categories.find(c=>c.id==id)}
function player(id){return db.players.find(p=>p.id==id)}
function month(){return new Date().toISOString().slice(0,7)}
function page(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==p)); document.getElementById('title').textContent={dashboard:'Dashboard',players:'Deportistas',categories:'Categorías',attendance:'Asistencia',fees:'Mensualidades',payments:'Pagos',messages:'Mensajes',reports:'Reportes',settings:'Configuración'}[p]; render[p]()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
document.getElementById('quick').onclick=()=>openPlayer();

const render={
dashboard(){let total=db.players.length, paid=db.payments.filter(x=>x.month==month()).reduce((a,x)=>a+x.amount,0), overdue=fees().filter(x=>x.status==='Vencido').reduce((a,x)=>a+x.balance,0); document.getElementById('content').innerHTML=`
<div class="cards"><div class="card">👥 Deportistas<div class="n">${total}</div></div><div class="card">💵 Cobrado este mes<div class="n">${money(paid)}</div></div><div class="card">🔴 Vencido<div class="n">${money(overdue)}</div></div><div class="card">🏀 Categorías<div class="n">${db.categories.length}</div></div></div>
<div class="panel"><div class="sectionhead"><h2>Pagos pendientes</h2><button class="secondary" onclick="page('fees')">Ver mensualidades</button></div>${fees().filter(x=>x.status!=='Pagado').slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span><b>${x.name}</b><br><span class="muted">${x.month}</span></span><span><b>${money(x.balance)}</b> <span class="badge ${x.status==='Vencido'?'overdue':'pending'}">${x.status}</span></span></div>`).join('')||'<div class="empty">No hay pagos pendientes 🎉</div>'}</div>`},
players(){document.getElementById('content').innerHTML=`<div class="panel"><div class="sectionhead"><input id="ps" class="search" placeholder="Buscar deportista..." oninput="renderPlayers()"><button class="primary" onclick="openPlayer()">＋ Nuevo deportista</button></div><div class="tablewrap"><table><thead><tr><th>Deportista</th><th>Categoría</th><th>Tutor</th><th>WhatsApp</th><th>Estado</th><th></th></tr></thead><tbody id="pt"></tbody></table></div></div>`;renderPlayers()},
categories(){document.getElementById('content').innerHTML=`<div class="panel"><div class="sectionhead"><h2>Tarifas por categoría</h2><button class="primary" onclick="openCategory()">＋ Categoría</button></div><table><thead><tr><th>Categoría</th><th>Mensualidad</th><th>Deportistas</th><th></th></tr></thead><tbody>${db.categories.map(c=>`<tr><td><b>${c.name}</b></td><td>${money(c.fee)}</td><td>${db.players.filter(p=>p.categoryId==c.id).length}</td><td><button class="secondary" onclick="openCategory(${c.id})">Editar</button></td></tr>`).join('')}</tbody></table></div>`},
attendance(){let d=new Date().toISOString().slice(0,10);document.getElementById('content').innerHTML=`<div class="panel"><div class="sectionhead"><div><h2>Asistencia</h2><span class="muted">Selecciona una fecha y marca presentes.</span></div><input id="adate" type="date" value="${d}" onchange="renderAttendance()"></div><div id="alist"></div></div>`;renderAttendance()},
fees(){document.getElementById('content').innerHTML=`<div class="panel"><div class="sectionhead"><h2>Mensualidades</h2><input id="fm" type="month" value="${month()}" onchange="renderFees()"></div><div class="tablewrap"><table><thead><tr><th>Deportista</th><th>Categoría</th><th>Importe</th><th>Pagado</th><th>Saldo</th><th>Estado</th><th></th></tr></thead><tbody id="ft"></tbody></table></div></div>`;renderFees()},
payments(){document.getElementById('content').innerHTML=`<div class="panel"><div class="sectionhead"><h2>Pagos registrados</h2><button class="primary" onclick="openPayment()">＋ Registrar pago</button></div><table><thead><tr><th>Fecha</th><th>Deportista</th><th>Período</th><th>Método</th><th>Importe</th></tr></thead><tbody>${db.payments.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${player(x.playerId)?.name||'-'}</td><td>${x.month}</td><td>${x.method}</td><td><b>${money(x.amount)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin pagos registrados</td></tr>'}</tbody></table></div>`},
messages(){document.getElementById('content').innerHTML=`<div class="panel"><div class="sectionhead"><div><h2>Mensajes</h2><span class="muted">Genera mensajes listos para enviar por WhatsApp.</span></div><button class="primary" onclick="openMessage()">＋ Crear mensaje</button></div><table><thead><tr><th>Tipo</th><th>Destinatario</th><th>Mensaje</th><th></th></tr></thead><tbody>${db.messages.slice().reverse().map((m,i)=>`<tr><td>${m.type}</td><td>${m.to}</td><td style="max-width:450px;white-space:normal">${m.text}</td><td><button class="secondary" onclick="wa('${encodeURIComponent(m.phone||'')}','${encodeURIComponent(m.text)}')">WhatsApp</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No hay mensajes</td></tr>'}</tbody></table></div>`},
reports(){let expected=db.players.reduce((a,p)=>a+(cat(p.categoryId)?.fee||0),0), paid=db.payments.filter(x=>x.month==month()).reduce((a,x)=>a+x.amount,0);document.getElementById('content').innerHTML=`<div class="cards"><div class="card">Facturación esperada<div class="n">${money(expected)}</div></div><div class="card">Cobrado<div class="n">${money(paid)}</div></div><div class="card">Pendiente<div class="n">${money(Math.max(0,expected-paid))}</div></div><div class="card">Asistencia registrada<div class="n">${db.attendance.length}</div></div></div><div class="panel"><h2>Resumen</h2><p>Este reporte usa los datos guardados en este dispositivo. Puedes exportarlos desde Configuración.</p><button class="primary" onclick="exportData()">⬇ Exportar datos JSON</button> <button class="secondary" onclick="window.print()">🖨 Imprimir</button></div>`},
settings(){document.getElementById('content').innerHTML=`<div class="panel"><h2>Configuración</h2><div class="grid"><div class="field"><label>Nombre de la academia</label><input id="aname" value="${db.academy.name}"></div><div class="field"><label>Moneda</label><input id="acur" value="${db.academy.currency}"></div></div><div class="form-actions"><button class="primary" onclick="db.academy.name=aname.value;db.academy.currency=acur.value||'Bs';save();toast('Configuración guardada');page('dashboard')">Guardar</button><button class="secondary" onclick="exportData()">Exportar respaldo</button><button class="danger" onclick="resetData()">Borrar todos los datos</button></div></div>`}
};
function fees(){let m=month();return db.players.map(p=>{let amount=cat(p.categoryId)?.fee||0, paid=db.payments.filter(x=>x.playerId==p.id&&x.month==m).reduce((a,x)=>a+x.amount,0),bal=Math.max(0,amount-paid);return {id:p.id,name:p.name,month:m,amount,paid,balance:bal,status:bal<=0?'Pagado':paid>0?'Pendiente':'Vencido'}})}
function renderPlayers(){let q=(document.getElementById('ps')?.value||'').toLowerCase();let rows=db.players.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<tr><td><b>${p.name}</b></td><td>${cat(p.categoryId)?.name||'-'}</td><td>${p.tutor||'-'}</td><td>${p.phone||'-'}</td><td><span class="badge paid">${p.status||'Activo'}</span></td><td><button class="secondary" onclick="openPlayer(${p.id})">Editar</button> <button class="danger" onclick="delPlayer(${p.id})">Eliminar</button></td></tr>`).join('');document.getElementById('pt').innerHTML=rows||'<tr><td colspan="6" class="empty">No hay deportistas</td></tr>'}
function renderFees(){let m=document.getElementById('fm').value, rows=db.players.map(p=>{let amount=cat(p.categoryId)?.fee||0,paid=db.payments.filter(x=>x.playerId==p.id&&x.month==m).reduce((a,x)=>a+x.amount,0),bal=Math.max(0,amount-paid),status:bal<=0?'Pagado':paid>0?'Pendiente':'Vencido';return `<tr><td><b>${p.name}</b></td><td>${cat(p.categoryId)?.name||'-'}</td><td>${money(amount)}</td><td>${money(paid)}</td><td>${money(bal)}</td><td><span class="badge ${status==='Pagado'?'paid':status==='Pendiente'?'pending':'overdue'}">${status}</span></td><td>${bal>0?`<button class="primary" onclick="openPayment(${p.id},'${m}',${bal})">Cobrar</button> <button class="secondary" onclick="makeReminder(${p.id},'${m}',${bal})">Recordar</button>`:''}</td></tr>`});document.getElementById('ft').innerHTML=rows||'<tr><td colspan="7" class="empty">No hay deportistas</td></tr>'}
function renderAttendance(){let d=document.getElementById('adate').value;let a=db.attendance.filter(x=>x.date==d);document.getElementById('alist').innerHTML=db.players.map(p=>{let rec=a.find(x=>x.playerId==p.id);return `<div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee"><span><b>${p.name}</b> <span class="muted">${cat(p.categoryId)?.name||''}</span></span><label><input type="checkbox" ${rec?.present?'checked':''} onchange="setAtt(${p.id},this.checked,'${d}')"> Presente</label></div>`}).join('')||'<div class="empty">Agrega deportistas primero.</div>'}
function setAtt(pid,present,date){let i=db.attendance.findIndex(x=>x.playerId==pid&&x.date==date);if(i>=0)db.attendance[i].present=present;else db.attendance.push({playerId:pid,date,present});save();toast('Asistencia guardada')}
function openPlayer(id){let p=player(id)||{name:'',dob:'',categoryId:db.categories[0]?.id||'',tutor:'',phone:'',position:'',number:'',status:'Activo',notes:''};openModal('Deportista',`<div class="grid"><div class="field"><label>Nombre completo</label><input id="pn" value="${p.name}"></div><div class="field"><label>Fecha de nacimiento</label><input id="pd" type="date" value="${p.dob}"></div><div class="field"><label>Categoría</label><select id="pc">${db.categories.map(c=>`<option value="${c.id}" ${p.categoryId==c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>Posición</label><input id="pp" value="${p.position||''}" placeholder="Base, escolta..."></div><div class="field"><label>Número</label><input id="pnum" value="${p.number||''}"></div><div class="field"><label>Tutor</label><input id="ptu" value="${p.tutor||''}"></div><div class="field"><label>WhatsApp</label><input id="ph" value="${p.phone||''}" placeholder="591..."></div><div class="field"><label>Estado</label><select id="pst"><option ${p.status==='Activo'?'selected':''}>Activo</option><option ${p.status==='Inactivo'?'selected':''}>Inactivo</option></select></div><div class="field" style="grid-column:1/-1"><label>Observaciones</label><textarea id="pno">${p.notes||''}</textarea></div></div><div class="form-actions"><button class="primary" onclick="savePlayer(${id||0})">Guardar deportista</button></div>`)}
function savePlayer(id){let p={id:id||Date.now(),name:pn.value.trim(),dob:pd.value,categoryId:+pc.value,position:pp.value,number:pnum.value,tutor:ptu.value,phone:ph.value,status:pst.value,notes:pno.value};if(!p.name)return toast('Escribe el nombre');if(id){let i=db.players.findIndex(x=>x.id==id);db.players[i]=p}else db.players.push(p);save();closeModal();toast('Deportista guardado');page('players')}
function delPlayer(id){if(confirm('¿Eliminar deportista y sus datos?')){db.players=db.players.filter(p=>p.id!=id);db.payments=db.payments.filter(x=>x.playerId!=id);db.attendance=db.attendance.filter(x=>x.playerId!=id);save();renderPlayers();toast('Eliminado')}}
function openCategory(id){let c=cat(id)||{name:'',fee:0};openModal('Categoría',`<div class="grid"><div class="field"><label>Nombre</label><input id="cn" value="${c.name}"></div><div class="field"><label>Mensualidad</label><input id="cf" type="number" value="${c.fee}"></div></div><div class="form-actions"><button class="primary" onclick="saveCat(${id||0})">Guardar</button></div>`)}
function saveCat(id){let c={id:id||Date.now(),name:cn.value.trim(),fee:+cf.value};if(id)db.categories[db.categories.findIndex(x=>x.id==id)]=c;else db.categories.push(c);save();closeModal();page('categories')}
function openPayment(pid,mon,bal){pid=pid||db.players[0]?.id;mon=mon||month();openModal('Registrar pago',`<div class="grid"><div class="field"><label>Deportista</label><select id="payp">${db.players.map(p=>`<option value="${p.id}" ${p.id==pid?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="field"><label>Período</label><input id="paym" type="month" value="${mon}"></div><div class="field"><label>Importe</label><input id="paya" type="number" step="0.01" value="${bal||cat(db.players.find(p=>p.id==pid)?.categoryId)?.fee||0}"></div><div class="field"><label>Método</label><select id="paymethod"><option>Efectivo</option><option>Transferencia</option><option>QR</option><option>Tarjeta</option></select></div></div><div class="form-actions"><button class="primary" onclick="savePayment()">Guardar pago</button></div>`)}
function savePayment(){db.payments.push({id:Date.now(),playerId:+payp.value,month:paym.value,amount:+paya.value,method:paymethod.value,date:new Date().toISOString().slice(0,10)});save();closeModal();toast('Pago registrado');page('payments')}
function makeReminder(pid,m,b){let p=player(pid),text=`Hola, ${p.tutor||''} 👋\n\nTe recordamos que la mensualidad de ${p.name} correspondiente a ${m} está pendiente.\nMonto: ${money(b)}\n\nGracias por formar parte de ${db.academy.name} 🏀`;db.messages.push({id:Date.now(),type:'Recordatorio',to:p.tutor||p.name,phone:p.phone,text});save();toast('Mensaje creado');page('messages')}
function openMessage(){openModal('Nuevo mensaje',`<div class="grid"><div class="field"><label>Deportista</label><select id="mp">${db.players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select id="mt"><option>Comunicado</option><option>Recordatorio</option><option>Pago recibido</option></select></div><div class="field" style="grid-column:1/-1"><label>Mensaje</label><textarea id="mx" placeholder="Escribe el mensaje..."></textarea></div></div><div class="form-actions"><button class="primary" onclick="saveMessage()">Guardar mensaje</button></div>`)}
function saveMessage(){let p=player(+mp.value);let text=mx.value;db.messages.push({id:Date.now(),type:mt.value,to:p.tutor||p.name,phone:p.phone,text});save();closeModal();page('messages')}
function wa(phone,text){window.open(`https://wa.me/${phone}?text=${text}`,'_blank')}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}
function exportData(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(db,null,2));a.download='respaldo-basketadmin.json';a.click()}
function resetData(){if(confirm('Esto borrará todos los datos guardados en este dispositivo. ¿Continuar?')){localStorage.removeItem(KEY);location.reload()}}
page('dashboard');
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script></body>
</html>
